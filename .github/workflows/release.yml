name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 本地用 Apple Development 证书签名；CI 没有证书，改为 ad-hoc 签名
      - name: Ad-hoc signing for CI
        run: |
          sed -i '' -E 's/CODE_SIGN_IDENTITY = [^;]+;/CODE_SIGN_IDENTITY = "-";/; s/DEVELOPMENT_TEAM = [^;]+;/DEVELOPMENT_TEAM = "";/; s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' macos/Runner.xcodeproj/project.pbxproj
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent melody_keeeys.app "$GITHUB_WORKSPACE/MelodyKeeeys-${GITHUB_REF_NAME}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: MelodyKeeeys-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "MelodyKeeeys-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MelodyKeeeys-*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libayatana-appindicator3-dev libkeybinder-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: tar -C build/linux/x64/release -czf "MelodyKeeeys-${GITHUB_REF_NAME}-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: MelodyKeeeys-*.tar.gz

  release:
    needs: [macos, windows, linux]
    # macOS 是主平台：它成功就发版，Windows/Linux 产物有则附上
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/release-notes.md
          files: dist/*
